server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Проверка серверной сессии (cookie ktk_session)
    location = /_auth {
        internal;
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream/api/auth/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location @go_auth {
        return 302 http://localhost:8082/?next=$scheme://$http_host$request_uri;
    }

    location @api_unauthorized {
        default_type application/json;
        return 401 '{"error":"Требуется авторизация. Войдите через портал на порту 8082."}';
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"Сервер API временно недоступен. Подождите и обновите страницу."}';
    }

    location / {
        auth_request /_auth;
        error_page 401 = @go_auth;
        try_files $uri $uri/ /index.html;
    }

    location = /api/health {
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        auth_request /_auth;
        error_page 401 = @api_unauthorized;
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location /ws {
        auth_request /_auth;
        error_page 401 = @go_auth;
        set $ws_upstream backend:8106;
        rewrite ^/ws/?$ / break;
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass http://$ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
