# Единый backend для Railway (auth + gateway + storage + …).
# В Railway: Settings → Config-as-code → этот файл.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "python -m backend.run_all --host :: --gateway-port 8000 --auth-port 8102 --fastapi-port 8010 --presence-port 8106"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
