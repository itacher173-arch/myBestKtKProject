server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /_auth {
        internal;
        set $api_upstream system-api:8000;
        proxy_pass http://$api_upstream/api/auth/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location @api_unauthorized {
        default_type application/json;
        return 401 '{"error":"Требуется авторизация администратора."}';
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"Сервер API временно недоступен. Подождите и обновите страницу."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Логин/логаут без auth_request
    location = /api/auth/login {
        set $api_upstream system-api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location = /api/auth/logout {
        set $api_upstream system-api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location /api/ {
        auth_request /_auth;
        error_page 401 = @api_unauthorized;
        set $api_upstream system-api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }
}
