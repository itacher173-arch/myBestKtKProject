# По умолчанию сервис из корня репозитория = публичный UI (web).
# Для auth-api / system-api в Railway → Settings → Config-as-code
# укажите: deploy/railway/auth-api.railway.toml или system-api.railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile.web"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
