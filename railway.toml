# Публичный UI: auth (/) + КТК (/app/) + admin (/admin/)
# Этот файл подхватывается сервисом, у которого Config-as-code = /railway.toml
# (сейчас так у myBestKtKProject). Остальные сервисы задаются отдельно в UI.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile.web"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
