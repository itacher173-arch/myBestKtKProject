services:
  auth:
    build:
      context: ./auth-frontend
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
      - auth
    restart: unless-stopped

  admin:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
      - "8106:8106"
    environment:
      KTK_HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://ktk:ktk@postgres:5432/ktk"
      REDIS_URL: "redis://redis:6379/0"
      KTK_ADMIN_LOGIN: "admin"
      KTK_ADMIN_NAME: "Администратор"
      KTK_ADMIN_PASSWORD: "admin"
    volumes:
      - backend_runtime:/app/backend/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ktk
      POSTGRES_PASSWORD: ktk
      POSTGRES_DB: ktk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktk -d ktk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  backend_runtime:
  postgres_data:
  redis_data:
