services:
  auth:
    build:
      context: ./auth-frontend
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
      - auth
    restart: unless-stopped

  admin:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
      - "8010:8010"
      - "8106:8106"
    environment:
      KTK_HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://ktk:ktk@postgres:5432/ktk"
      REDIS_URL: "redis://redis:6379/0"
      KTK_ADMIN_LOGIN: "admin"
      KTK_ADMIN_NAME: "Администратор"
      KTK_ADMIN_PASSWORD: "admin"
      KTK_AUDIT_HMAC_SECRET: "ktk-dev-audit-secret-change-me"
      KTK_FASTAPI_PORT: "8010"
      KTK_FASTAPI_URL: "http://127.0.0.1:8010"
    volumes:
      - backend_runtime:/app/backend/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ktk
      POSTGRES_PASSWORD: ktk
      POSTGRES_DB: ktk
    # Порт наружу не публикуем (доступ только из docker-сети)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktk -d ktk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Порт наружу не публикуем (доступ только из docker-сети)
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  backend_runtime:
  postgres_data:
  redis_data:
