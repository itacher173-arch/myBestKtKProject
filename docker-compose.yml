services:
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      API_HOST: "system-api"
      GATEWAY_PORT: "8000"
      FASTAPI_PORT: "8010"
      PRESENCE_PORT: "8106"
      AUTH_REDIRECT_PATH: "/"
      DNS_RESOLVER: "127.0.0.11"
    depends_on:
      system-api:
        condition: service_healthy
    restart: unless-stopped

  auth-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.auth.app", "--host", "0.0.0.0", "--port", "8102"]
    environment:
      DATABASE_URL: "postgresql://ktk:ktk@postgres:5432/ktk"
      REDIS_URL: "redis://redis:6379/0"
      KTK_ADMIN_LOGIN: "${KTK_ADMIN_LOGIN:?Задайте KTK_ADMIN_LOGIN вне репозитория}"
      KTK_ADMIN_NAME: "${KTK_ADMIN_NAME:-Администратор}"
      KTK_ADMIN_PASSWORD: "${KTK_ADMIN_PASSWORD:?Задайте KTK_ADMIN_PASSWORD вне репозитория}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  system-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
      - "8010:8010"
      - "8106:8106"
    environment:
      KTK_HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://ktk:ktk@postgres:5432/ktk"
      REDIS_URL: "redis://redis:6379/0"
      KTK_AUTH_URL: "http://auth-api:8102"
      KTK_AUDIT_HMAC_SECRET: "ktk-dev-audit-secret-change-me"
      KTK_FASTAPI_PORT: "8010"
      KTK_FASTAPI_URL: "http://127.0.0.1:8010"
      KTK_CORS_ORIGINS: "http://localhost:8080"
    command: ["python", "-m", "backend.run_system", "--host", "0.0.0.0"]
    volumes:
      - backend_runtime:/app/backend/runtime
    depends_on:
      auth-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ktk
      POSTGRES_PASSWORD: ktk
      POSTGRES_DB: ktk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktk -d ktk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  backend_runtime:
  postgres_data:
  redis_data:
