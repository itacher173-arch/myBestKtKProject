services:
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        VITE_APP_URL: ${VITE_APP_URL:-/app/}
        VITE_AUTH_URL: ${VITE_AUTH_URL:-/}
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      API_HOST: "system-api"
      GATEWAY_PORT: "8000"
      FASTAPI_PORT: "8010"
      PRESENCE_PORT: "8106"
      AUTH_REDIRECT_PATH: "/"
      DNS_RESOLVER: "127.0.0.11"
    depends_on:
      system-api:
        condition: service_healthy
    restart: unless-stopped

  auth-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.auth.app", "--host", "0.0.0.0", "--port", "8102"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ktk}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ktk}"
      REDIS_URL: "redis://redis:6379/0"
      KTK_ADMIN_LOGIN: "${KTK_ADMIN_LOGIN:?Задайте KTK_ADMIN_LOGIN вне репозитория}"
      KTK_ADMIN_NAME: "${KTK_ADMIN_NAME:-Администратор}"
      KTK_ADMIN_PASSWORD: "${KTK_ADMIN_PASSWORD:?Задайте KTK_ADMIN_PASSWORD вне репозитория}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rag-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "python",
        "-m",
        "backend.rag.app",
        "--host",
        "0.0.0.0",
        "--port",
        "8108",
        "--index-on-start",
      ]
    environment:
      KTK_QDRANT_URL: "http://qdrant:6333"
      KTK_RAG_COLLECTION: "${KTK_RAG_COLLECTION:-ktk_knowledge}"
      KTK_RAG_EMBEDDING_PROVIDER: "${KTK_RAG_EMBEDDING_PROVIDER:-auto}"
      KTK_KNOWLEDGE_INDEX_VERSION: "${KTK_KNOWLEDGE_INDEX_VERSION:-knowledge-v1}"
      KTK_OLLAMA_URL: "http://ollama:11434"
      KTK_OLLAMA_EMBED_MODEL: "${KTK_OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8108/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  ml-recommender:
    build:
      context: .
      dockerfile: backend/ai/Dockerfile.ml
    environment:
      KTK_AI_PROVIDER: "rules"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8109/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    profiles: ["llm"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      KTK_OLLAMA_BASE_MODEL: "${KTK_OLLAMA_BASE_MODEL:-qwen2.5:3b}"
      KTK_OLLAMA_MODEL: "${KTK_OLLAMA_MODEL:-ktk-assistant}"
      KTK_OLLAMA_EMBED_MODEL: "${KTK_OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    volumes:
      - ./backend/ai/ollama:/model:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "$${KTK_OLLAMA_BASE_MODEL}"
        ollama pull "$${KTK_OLLAMA_EMBED_MODEL}"
        ollama create "$${KTK_OLLAMA_MODEL}" -f /model/Modelfile
    depends_on:
      ollama:
        condition: service_started
    restart: "no"

  rag-index-ollama:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["llm"]
    command: ["python", "-m", "backend.rag.indexer", "--force"]
    environment:
      KTK_QDRANT_URL: "http://qdrant:6333"
      KTK_RAG_COLLECTION: "${KTK_RAG_COLLECTION:-ktk_knowledge}"
      KTK_RAG_EMBEDDING_PROVIDER: "ollama"
      KTK_KNOWLEDGE_INDEX_VERSION: "${KTK_KNOWLEDGE_INDEX_VERSION:-knowledge-v1}"
      KTK_OLLAMA_URL: "http://ollama:11434"
      KTK_OLLAMA_EMBED_MODEL: "${KTK_OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    restart: "no"

  ai-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.ai.app", "--host", "0.0.0.0", "--port", "8107"]
    environment:
      KTK_AI_ENABLED: "${KTK_AI_ENABLED:-true}"
      KTK_AI_PROVIDER: "${KTK_AI_PROVIDER:-rules}"
      KTK_ML_URL: "http://ml-recommender:8109"
      KTK_RAG_URL: "http://rag-api:8108"
      KTK_OLLAMA_URL: "http://ollama:11434"
      KTK_OLLAMA_MODEL: "${KTK_OLLAMA_MODEL:-ktk-assistant}"
      KTK_AI_PROMPT_VERSION: "${KTK_AI_PROMPT_VERSION:-ai-prompts-v1}"
    depends_on:
      ml-recommender:
        condition: service_healthy
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8107/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  system-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 8010/8106 не публикуем наружу — только через web (:8080).
    # 8000 — опционально для отладки gateway; основной вход — web.
    ports:
      - "8000:8000"
    environment:
      KTK_HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ktk}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ktk}"
      REDIS_URL: "redis://redis:6379/0"
      KTK_AUTH_URL: "http://auth-api:8102"
      KTK_AUDIT_HMAC_SECRET: "${KTK_AUDIT_HMAC_SECRET:?Задайте KTK_AUDIT_HMAC_SECRET вне репозитория}"
      KTK_FASTAPI_PORT: "8010"
      KTK_FASTAPI_URL: "http://127.0.0.1:8010"
      KTK_AI_URL: "http://ai-api:8107"
      KTK_CORS_ORIGINS: "http://localhost:8080"
    command: ["python", "-m", "backend.run_system", "--host", "0.0.0.0"]
    volumes:
      - backend_runtime:/app/backend/runtime
    depends_on:
      auth-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ktk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ktk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  backend_runtime:
  ollama_data:
  postgres_data:
  qdrant_data:
  redis_data:
