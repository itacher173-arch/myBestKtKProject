services:
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        VITE_APP_URL: ${VITE_APP_URL:-/app/}
        VITE_AUTH_URL: ${VITE_AUTH_URL:-/}
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      API_HOST: "system-api"
      GATEWAY_PORT: "8000"
      FASTAPI_PORT: "8010"
      PRESENCE_PORT: "8106"
      AUTH_REDIRECT_PATH: "/"
      DNS_RESOLVER: "127.0.0.11"
    depends_on:
      system-api:
        condition: service_healthy
    restart: unless-stopped

  auth-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.auth.app", "--host", "0.0.0.0", "--port", "8102"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ktk}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ktk}"
      REDIS_URL: "redis://redis:6379/0"
      KTK_ADMIN_LOGIN: "${KTK_ADMIN_LOGIN:?Задайте KTK_ADMIN_LOGIN вне репозитория}"
      KTK_ADMIN_NAME: "${KTK_ADMIN_NAME:-Администратор}"
      KTK_ADMIN_PASSWORD: "${KTK_ADMIN_PASSWORD:?Задайте KTK_ADMIN_PASSWORD вне репозитория}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rag-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "python",
        "-m",
        "backend.rag.app",
        "--host",
        "0.0.0.0",
        "--port",
        "8108",
        "--index-on-start",
      ]
    environment:
      KTK_QDRANT_URL: "http://qdrant:6333"
      KTK_RAG_COLLECTION: "${KTK_RAG_COLLECTION:-ktk_knowledge}"
      KTK_RAG_EMBEDDING_PROVIDER: "${KTK_RAG_EMBEDDING_PROVIDER:-hash}"
      KTK_KNOWLEDGE_INDEX_VERSION: "${KTK_KNOWLEDGE_INDEX_VERSION:-knowledge-v3}"
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8108/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  ml-recommender:
    build:
      context: .
      dockerfile: backend/ai/Dockerfile.ml
    environment:
      KTK_AI_PROVIDER: "rules"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8109/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  llm-model:
    image: curlimages/curl:latest
    user: "0:0"
    environment:
      KTK_LLM_MODEL_FILE: "${KTK_LLM_MODEL_FILE:-Qwen2.5-1.5B-Instruct-Q4_K_M.gguf}"
      KTK_LLM_MODEL_URL: "${KTK_LLM_MODEL_URL:-https://github.com/itacher173-arch/myBestKtKProject/releases/download/ai-model-qwen2.5-1.5b-v1/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf}"
      KTK_LLM_MODEL_FALLBACK_URL: "https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf?download=true"
      KTK_LLM_MODEL_SHA256: "${KTK_LLM_MODEL_SHA256:-1adf0b11065d8ad2e8123ea110d1ec956dab4ab038eab665614adba04b6c3370}"
    volumes:
      - llm_models:/models
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        target="/models/$${KTK_LLM_MODEL_FILE}"
        if [ ! -s "$${target}" ]; then
          echo "Downloading $${KTK_LLM_MODEL_FILE}"
          curl --fail --location --retry 5 "$${KTK_LLM_MODEL_URL}" --output "$${target}.part" ||
            curl --fail --location --retry 5 "$${KTK_LLM_MODEL_FALLBACK_URL}" --output "$${target}.part"
          if [ -n "$${KTK_LLM_MODEL_SHA256}" ]; then
            echo "$${KTK_LLM_MODEL_SHA256}  $${target}.part" | sha256sum -c -
          fi
          mv "$${target}.part" "$${target}"
        fi
    restart: "no"

  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - "-m"
      - "/models/${KTK_LLM_MODEL_FILE:-Qwen2.5-1.5B-Instruct-Q4_K_M.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "8192"
      - "-np"
      - "2"
      - "--jinja"
    volumes:
      - llm_models:/models:ro
    depends_on:
      llm-model:
        condition: service_completed_successfully
    restart: unless-stopped

  ai-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.ai.app", "--host", "0.0.0.0", "--port", "8107"]
    environment:
      KTK_AI_ENABLED: "${KTK_AI_ENABLED:-true}"
      KTK_AI_PROVIDER: "${KTK_AI_PROVIDER:-auto}"
      KTK_ML_URL: "http://ml-recommender:8109"
      KTK_RAG_URL: "http://rag-api:8108"
      KTK_LLM_URL: "http://llm-server:8080"
      KTK_LLM_MODEL: "${KTK_LLM_MODEL:-qwen2.5-1.5b-instruct}"
      KTK_AI_PROMPT_VERSION: "${KTK_AI_PROMPT_VERSION:-ai-prompts-v2}"
    depends_on:
      llm-server:
        condition: service_started
      ml-recommender:
        condition: service_healthy
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8107/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  system-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 8010/8106 не публикуем наружу — только через web (:8080).
    # 8000 — опционально для отладки gateway; основной вход — web.
    ports:
      - "8000:8000"
    environment:
      KTK_HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ktk}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ktk}"
      REDIS_URL: "redis://redis:6379/0"
      KTK_AUTH_URL: "http://auth-api:8102"
      KTK_AUDIT_HMAC_SECRET: "${KTK_AUDIT_HMAC_SECRET:?Задайте KTK_AUDIT_HMAC_SECRET вне репозитория}"
      KTK_FASTAPI_PORT: "8010"
      KTK_FASTAPI_URL: "http://127.0.0.1:8010"
      KTK_AI_URL: "http://ai-api:8107"
      KTK_CORS_ORIGINS: "http://localhost:8080"
    command: ["python", "-m", "backend.run_system", "--host", "0.0.0.0"]
    volumes:
      - backend_runtime:/app/backend/runtime
    depends_on:
      auth-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ktk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ktk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  backend_runtime:
  llm_models:
  postgres_data:
  qdrant_data:
  redis_data:
